name = "cf-r2-webdav"
main = "src/index.ts"
compatibility_date = "2026-11-03"
workers_dev = true

[vars]
BUCKET_NAME = "webdav"
MAX_UPLOAD_BYTES = "104857600"
MAX_LIST_ITEMS = "1000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "webdav"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

