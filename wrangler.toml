name = "cf-r2-webdav"
main = "src/index.ts"
compatibility_date = "2026-11-03"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[vars]
BUCKET_NAME = "webdav"
MAX_UPLOAD_BYTES = "104857600"
MAX_LIST_ITEMS = "1000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "webdav"
