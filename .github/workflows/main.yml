name: Verify and deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfr2-webdav-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Security regression tests
        run: npm test
      - name: Validate Wrangler build
        run: npx --yes wrangler@4.156.1 deploy --dry-run --outdir .wrangler/deploy

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBDAV_USERNAME: ${{ secrets.USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -eu
          test -n "$CF_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$WEBDAV_USERNAME" || { echo 'Missing USERNAME'; exit 1; }
          test -n "$WEBDAV_PASSWORD" || { echo 'Missing PASSWORD'; exit 1; }
          case "$WEBDAV_USERNAME" in *:*) echo 'USERNAME must not contain a colon'; exit 1 ;; esac
          test "${#WEBDAV_PASSWORD}" -ge 20 || { echo 'PASSWORD must contain at least 20 characters'; exit 1; }
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.1 deploy --config wrangler.toml
      - name: Apply WebDAV credentials as Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEBDAV_USERNAME: ${{ secrets.USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -eu
          printf '%s' "$WEBDAV_USERNAME" | npx --yes wrangler@4.156.1 secret put USERNAME --config wrangler.toml
          printf '%s' "$WEBDAV_PASSWORD" | npx --yes wrangler@4.156.1 secret put PASSWORD --config wrangler.toml
