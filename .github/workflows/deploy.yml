name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm deployment to the production Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cfr2-webdav-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$USERNAME"
          test -n "$PASSWORD"
          if [ "${#USERNAME}" -gt 128 ] || [[ "$USERNAME" == *:* ]]; then
            echo "USERNAME must be at most 128 characters and cannot contain a colon."
            exit 1
          fi
          if [ "${#PASSWORD}" -lt 20 ] || [ "${#PASSWORD}" -gt 1024 ]; then
            echo "PASSWORD must be between 20 and 1024 characters."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run verification before deployment
        run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high

      - name: Validate Worker deployment bundle
        run: ./node_modules/.bin/wrangler deploy --dry-run --outdir .wrangler/deploy --config wrangler.toml

      - name: Deploy Worker to Cloudflare
        run: ./node_modules/.bin/wrangler deploy --config wrangler.toml

      - name: Configure WebDAV username secret
        shell: bash
        run: printf '%s' "$USERNAME" | ./node_modules/.bin/wrangler secret put USERNAME --name cf-r2-webdav --config wrangler.toml

      - name: Configure WebDAV password secret
        shell: bash
        run: printf '%s' "$PASSWORD" | ./node_modules/.bin/wrangler secret put PASSWORD --name cf-r2-webdav --config wrangler.toml

# Manual production deployment only. The R2 bucket binding points to the existing
# bucket "webdav"; this workflow never creates, empties, migrates, or deletes R2 data.
