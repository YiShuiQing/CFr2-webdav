name: Verify security hardening

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfr2-webdav-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Type check, security tests and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Security regression tests
        run: npm test

      - name: Validate Worker build (dry run only)
        run: ./node_modules/.bin/wrangler deploy --dry-run --outdir .wrangler/deploy --config wrangler.toml

# This workflow intentionally has no Cloudflare credentials and no deployment job.
# Production deployment will be added as a separate, explicitly gated workflow after CI passes.
